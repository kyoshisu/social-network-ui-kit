<div class="checkbox-group">
  <span class="checkbox-group__title">Настройки уведомлений</span>
  <label class="checkbox">
    <input type="checkbox" class="checkbox__input" checked>
    <span class="checkbox__box" aria-hidden="true"></span>
    <span class="checkbox__label">Новые комментарии</span>
  </label>
  <label class="checkbox">
    <input type="checkbox" class="checkbox__input">
    <span class="checkbox__box" aria-hidden="true"></span>
    <span class="checkbox__label">Новые подписчики</span>
  </label>
</div>

<div class="radio-group">
  <span class="radio-group__title">Видимость профиля</span>
  <label class="radio">
    <input type="radio" name="visibility" class="radio__input" value="public" checked>
    <span class="radio__circle" aria-hidden="true"></span>
    <span class="radio__label">Публичный</span>
  </label>
  <label class="radio">
    <input type="radio" name="visibility" class="radio__input" value="friends">
    <span class="radio__circle" aria-hidden="true"></span>
    <span class="radio__label">Только подписчики</span>
  </label>
  <label class="radio">
    <input type="radio" name="visibility" class="radio__input" value="private">
    <span class="radio__circle" aria-hidden="true"></span>
    <span class="radio__label">Приватный</span>
  </label>
</div>
