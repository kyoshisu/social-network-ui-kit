<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прогресс-бар</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    #progress-bar {
      width: 100%;
      height: 24px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
    }

    #progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #4caf50;
      transition: width 0.3s ease;
    }

    #status {
      margin-top: 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Загрузка</h1>
  <div id="progress-bar">
    <div id="progress-bar-fill"></div>
  </div>
  <p id="status">Ожидание...</p>

  <script>
    const fill = document.getElementById('progress-bar-fill');
    const status = document.getElementById('status');
    const totalTime = 5000;
    const stepTime = 1000;
    const stepPercent = 20;
    let progress = 0;

    const timer = setInterval(() => {
      progress += stepPercent;
      fill.style.width = progress + '%';

      if (progress >= 100) {
        clearInterval(timer);
        status.textContent = 'Готово!';
      }
    }, stepTime);
  </script>
</body>
</html>
